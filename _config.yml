# Jekyll Garden Configuration
# Optimized for jubilancy.github.io/jekyll-garden

# Preferences (controls template behavior)
preferences:
  homepage:
    enabled: false
  search:
    enabled: true
  backlinks:
    enabled: true
  pagepreview:
    enabled: true
  wiki_style_link:
    enabled: true

# Site Configuration
title: "Eliana's Garden"
heading: "eliana"
description: "A digital garden"
url: "https://jubilancy.github.io"
baseurl: /jekyll-garden

# Asset Configuration
apple_touch_icon: "/assets/img/profile.png"
css_file: "/assets/css/style.css"
ie_css: "/assets/css/ie-target.css"

# Menu Items (lowercase)
menu:
  - title: "notes"
    url: "/notes"
  - title: "garden"
    url: "/garden"
  - title: "about"
    url: "/about"

# Footer
footer:
  copyright: "© 2026 eliana"
  credits:
    enabled: true
    url: "/credits"
    text: "credits"

# Collections
collections:
  notes:
    output: true
    permalink: /:collection/:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "Post"
      content-type: "notes"
      feed: "show"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "Post"
      content-type: "post"
      feed: "show"
      permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Private links (for broken wiki links)
privatelinks:
  title: "Private Note"
  msg: "This note hasn't been published yet."

# Math rendering
katex: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
